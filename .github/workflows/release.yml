name: Release

# Pushing a version tag (v0.1.0) tests and builds that commit, points the
# Homebrew formula at the tag's source archive, installs that formula from
# source and tests it, and only then publishes: the GitHub release first, the
# formula update on main second. A failure before that publishes nothing.
#
# Every step is safe to repeat, so a failed release is recovered by running
# this workflow manually for the same tag (Actions → Release → Run workflow).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release again, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag name
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a version tag like v0.1.0"
            exit 1
          fi

      - name: Check that the repository is public
        run: |
          visibility="$(gh api "repos/$REPO" --jq .visibility)"
          if [ "$visibility" != "public" ]; then
            echo "::error::$REPO is $visibility. Homebrew downloads the source archive without authentication, so the repository must be public. Make it public, then run this workflow again for $TAG (Actions → Release → Run workflow)."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test and build the tagged commit
        run: make check

      - name: Checksum the source archive
        id: archive
        run: |
          url="https://github.com/$REPO/archive/refs/tags/$TAG.tar.gz"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --output "$RUNNER_TEMP/source.tar.gz" "$url"
          sha="$(shasum -a 256 "$RUNNER_TEMP/source.tar.gz" | cut -d ' ' -f 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha  $url"

      - name: Update the formula on main (local commit)
        env:
          ARCHIVE_URL: ${{ steps.archive.outputs.url }}
          ARCHIVE_SHA: ${{ steps.archive.outputs.sha }}
        run: |
          git checkout main
          git pull --ff-only origin main
          sed -i '' -E \
            -e "s|^  url \".*\"|  url \"$ARCHIVE_URL\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$ARCHIVE_SHA\"|" \
            Formula/mountkeeper.rb
          grep -q "sha256 \"$ARCHIVE_SHA\"" Formula/mountkeeper.rb
          if git diff --quiet -- Formula/mountkeeper.rb; then
            echo "The formula already points at $TAG."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "formula: mountkeeper ${TAG#v}" -- Formula/mountkeeper.rb
          fi

      - name: Validate the formula (build from source, then test)
        run: |
          brew style Formula/mountkeeper.rb
          brew tap "$REPO" "$GITHUB_WORKSPACE"
          brew install --build-from-source "$REPO/mountkeeper"
          brew test "$REPO/mountkeeper"
          test "$(mountkeeper --version)" = "mountkeeper version ${TAG#v}"

      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes --verify-tag
          fi

      - name: Publish the formula update
        run: git push origin main
